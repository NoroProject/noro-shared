# Паспорт модуля: только то, что мастеру нужно знать до запуска его кода.
#
# Подписки, ручки и задачи объявляются в самом коде — см. src/lib.rs.

[module]
id = "playtime-rewards"
name = "Награды за время в игре"
version = "1.0.0"
api = "1.0"
scope = "instance"
author = "noro"
description = "Считает наигранное время и начисляет за него очки"

# Что модуль просит. Выдаёт это оператор при установке, и выдать он может меньше.
[capabilities]
players = ["read"]
store = true
roles = ["read", "grant"]
cache = ["read", "write"]
web_ws = ["read", "notify"]
modules = ["call"]

[[permissions]]
node = "noro.module.playtime-rewards.reset"
label = "mod-playtime-rewards-perm-reset"

# Страница в кабинете игрока (в существующей группе "profile")
[[apps]]
placement = "cabinet"
kind = "vue"
entry = "app.js"
title = "mod-playtime-rewards-title"
icon = "i-lucide-gift"
category = "profile"
order = 50

# Страница в панели управления (в существующей группе "players")
[[apps]]
id = "admin"
placement = "admin"
kind = "vue"
entry = "app.js"
title = "mod-playtime-rewards-title"
icon = "i-lucide-gift"
category = "players"
order = 60

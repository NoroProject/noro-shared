# Свой workspace: модуль собирается под wasm32-unknown-unknown как cdylib и в
# общий workspace noro-shared не входит — тот собирается под хост.
[workspace]

[package]
name = "playtime-rewards"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
noro-sdk = { path = "../../crates/sdk" }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# panic = "abort" здесь нельзя: мастер ловит панику модуля и переживает её,
# а с abort инстанс уносит целиком.
panic = "unwind"

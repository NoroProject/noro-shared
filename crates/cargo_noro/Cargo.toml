[package]
name = "cargo-noro"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/NoroProject/noro-shared"
documentation = "https://noroproject.github.io/noro-shared/"
readme = "README.md"
authors.workspace = true
description = "Create, build, check and package a Noro module"

# Имя обязано быть `cargo-noro`: по нему cargo и находит подкоманду `cargo noro`.
[[bin]]
name = "cargo-noro"
path = "src/main.rs"

[dependencies]
noro-module-abi = { workspace = true, features = ["signing"] }
serde_json = { workspace = true }
zip = { workspace = true }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
toml = "0.8"

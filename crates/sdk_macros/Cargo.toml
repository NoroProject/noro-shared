[package]
name = "noro-sdk-macros"
version = "0.4.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/NoroProject/noro-shared"
documentation = "https://noroproject.github.io/noro-shared/"
readme = "README.md"
description = "Macros for Noro modules: #[noro::module] and the handler attributes"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[package]
name = "noro-sdk"
version = "0.3.0"
edition.workspace = true
license = "MIT"
repository = "https://github.com/NoroProject/noro-shared"
documentation = "https://noroproject.github.io/noro-shared/"
readme = "README.md"
description = "Write a module for a Noro instance: events, storage, endpoints and mini-apps"

[dependencies]
noro-module-abi = { workspace = true }
noro-sdk-macros = { workspace = true }
extism-pdk = "1"
serde = { workspace = true }
serde_json = { workspace = true }

# Те же ограничения цели `wasm32-unknown-unknown`, что и у noro-module-abi:
# ни источника случайности для `uuid`, ни системных часов для `chrono`.
uuid = { version = "1", default-features = false, features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }

[workspace]
resolver = "2"
members = [
    "crates/schema",
    "crates/i18n",
    "crates/mc_mod_utils",
    "crates/module_abi",
    "crates/sdk",
    "crates/sdk_macros",
    "crates/docs_gen",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["noro"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"

fluent-bundle = "0.16"
unic-langid = "0.9"
parking_lot = "0.12"
tracing = "0.1"

base64 = "0.22"
zip = "2"

schema = { path = "crates/schema" }
i18n = { path = "crates/i18n" }
mc_mod_utils = { path = "crates/mc_mod_utils" }
noro-module-abi = { path = "crates/module_abi" }
noro-sdk = { path = "crates/sdk" }
noro-sdk-macros = { path = "crates/sdk_macros" }
